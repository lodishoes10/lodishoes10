    <!-- Ukuran kertas cetak. Ditulis di sini, BUKAN di index.css, karena pipeline
         Tailwind v4 (Lightning CSS) membuang deskriptor `size` dari aturan @page.
         Default 80mm untuk struk thermal; halaman label memakai named page `labelsheet` (A4). -->
    <style>
      @page { size: 80mm auto; margin: 0; }
      @page labelsheet { size: A4 portrait; margin: 10mm; }
    </style>
